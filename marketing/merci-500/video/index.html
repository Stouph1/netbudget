<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NETbudget - Merci 500</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: block; src: url("fonts/Manrope-latin.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("fonts/JetBrainsMono-latin.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070E1C; color: #FAFAFA; font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070E1C; }
      .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 1100px 700px at 50% 50%, rgba(16,64,52,0.75) 0%, rgba(10,18,36,0.6) 45%, rgba(7,14,28,1) 80%); }
      .grain { position: absolute; inset: 0; opacity: 0.07; background-image: radial-gradient(rgba(255,255,255,0.6) 0.6px, transparent 0.7px); background-size: 7px 7px; }
      .clip { position: absolute; inset: 0; }
      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .mono { font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 600; letter-spacing: 0.22em; color: #A8B3C7; text-transform: uppercase; }
      .big { font-size: 190px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
      .accent { color: #6EE7B7; }
      .sub { font-size: 54px; font-weight: 600; color: #C7CDD8; letter-spacing: -0.02em; margin-top: 26px; }
      #dots { position: absolute; left: 460px; top: 180px; width: 1000px; height: 720px; }
      .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #6EE7B7; box-shadow: 0 0 12px rgba(110,231,183,0.7); opacity: 0; }
      #count .accent { display: inline-block; opacity: 0; text-shadow: 0 0 40px rgba(110,231,183,0.9), 0 0 90px rgba(16,185,129,0.6); }
      #count { position: absolute; left: 0; right: 0; top: 390px; text-align: center; font-size: 300px; font-weight: 800; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 10px 60px rgba(0,0,0,0.6); }
      #countlbl { position: absolute; left: 0; right: 0; top: 700px; text-align: center; }
      #ringwrap { position: absolute; left: 1340px; top: 40px; width: 600px; height: 600px; opacity: 0; }
      #ringwrap svg { width: 600px; height: 600px; transform: rotate(-90deg); }
      #ringwrap circle { fill: none; stroke-width: 34; stroke-linecap: butt; }
      #flash { position: absolute; inset: 0; background: #6EE7B7; opacity: 0; pointer-events: none; }
      .foot { position: absolute; left: 0; right: 0; bottom: 110px; display: flex; align-items: center; justify-content: center; gap: 22px; }
      .foot img { width: 64px; height: 64px; border-radius: 16px; }
      .foot span { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
      .foot .dim { color: #A8B3C7; font-weight: 500; }
      .fade { position: absolute; inset: 0; background: #070E1C; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="merci500" data-width="1920" data-height="1080" data-fps="30" data-duration="26">
      <div class="bg"></div><div class="grain"></div>

      <!-- 0 → 9 s : une personne, puis cinq cents -->
      <div class="clip" data-start="0" data-duration="9.8" data-layout-allow-overflow>
        <div id="dots"></div>
        <div id="count"><span id="num">1</span><span id="plus" class="accent">+</span></div>
        <div id="countlbl" class="mono">une personne</div>
      </div>

      <!-- 9 → 13 s : merci -->
      <div class="clip" data-start="9.6" data-duration="3.6" data-layout-allow-overflow>
        <div class="center"><div id="merci" class="big accent">Merci.</div></div>
      </div>

      <!-- 13 → 20.4 s : ce que ça veut dire -->
      <div class="clip" data-start="13" data-duration="7.5" data-layout-allow-overflow>
        <div class="center">
          <div id="l1" class="big" style="font-size:120px"><span class="accent">+ 500</span> personnes qui savent<br/>ce qu'il leur reste.</div>
          <div id="l2" class="sub"><span class="accent" style="font-weight:800">Rejoins-les.</span> Gratuit, sans compte, en cinq minutes.</div>
        </div>
      </div>

      <!-- 20.4 → 26 s : ce n'est qu'un début -->
      <div class="clip" data-start="20.4" data-duration="5.6" data-layout-allow-overflow>
        <div id="ringwrap">
          <svg viewBox="0 0 600 600">
            <circle id="r1" cx="300" cy="300" r="270" stroke="#10B981" stroke-dasharray="1696" stroke-dashoffset="1696"/>
            <circle id="r2" cx="300" cy="300" r="270" stroke="#A855F7" stroke-dasharray="1696" stroke-dashoffset="1696"/>
            <circle id="r3" cx="300" cy="300" r="270" stroke="#F59E0B" stroke-dasharray="1696" stroke-dashoffset="1696"/>
          </svg>
        </div>
        <div class="center"><div id="debut" class="big" style="font-size:150px">Et ce n'est<br/><span class="accent">qu'un début.</span></div></div>
        <div class="center" id="teaser" style="opacity:0">
          <div class="big" style="font-size:170px">La <span class="accent">2.0</span> arrive.</div>
        </div>
        <div class="foot" id="foot"><img src="assets/img/logo.png" alt="" /><span>netbudget.app</span><span class="dim">15 novembre</span></div>
      </div>

      <div id="flash" class="clip" data-start="0" data-duration="26" data-layout-allow-overflow></div>
      <div class="fade clip" id="fadeout" data-start="24.8" data-duration="1.2" data-layout-allow-overflow></div>

      <audio id="music" data-start="0" data-duration="26" data-media-start="__MEDIA_START__" data-volume="0.9" data-fade-in="1" data-fade-out="2.5" src="assets/music/__MUSIC__"></audio>
    </div>

    <script>
      // 500 points, placés une fois pour toutes par un générateur déterministe
      // (pas de Math.random : le rendu doit être identique image par image).
      (function () {
        var wrap = document.getElementById("dots");
        var seed = 20261026;
        function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
        for (var i = 0; i < 500; i++) {
          var d = document.createElement("div"); d.className = "dot";
          // nuage elliptique, plus dense au centre
          var a = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
          d.style.left = (500 + Math.cos(a) * r * 480 - 5) + "px";
          d.style.top = (360 + Math.sin(a) * r * 340 - 5) + "px";
          wrap.appendChild(d);
        }
      })();

      document.fonts.ready.then(function () {
        var tl = gsap.timeline({ paused: true });
        var count = document.getElementById("num");
        var num = { v: 1 };

        // 0 → 2.4 : une personne
        tl.fromTo(".dot:nth-child(250)", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.8, duration: 1.2, ease: "power2.out" }, 0.3);
        tl.fromTo("#count", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.4);
        tl.fromTo("#countlbl", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0.9);

        // 2.4 → 8 : les points arrivent, le compteur monte
        tl.to(".dot", { opacity: 0.9, scale: 1, duration: 0.5, stagger: { each: 0.01, from: "center" }, ease: "power1.out" }, 2.4);
        tl.to(num, { v: 500, duration: 5.4, ease: "power2.inOut", onUpdate: function () { count.textContent = String(Math.round(num.v)); } }, 2.4);
        tl.to("#countlbl", { opacity: 0, duration: 0.3 }, 2.6);
        tl.call(function () { document.getElementById("countlbl").textContent = "personnes"; }, null, 2.9);
        tl.to("#countlbl", { opacity: 1, duration: 0.5 }, 3.0);
        tl.to("#dots", { scale: 1.06, duration: 6, ease: "sine.inOut" }, 2.4);
        tl.fromTo("#plus", { opacity: 0, scale: 0.2, x: -40 }, { opacity: 1, scale: 1.08, x: 0, duration: 0.55, ease: "back.out(2.5)" }, 7.6);
        tl.to("#plus", { scale: 1, duration: 0.4, ease: "power2.out" }, 8.15);
        tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 7.6);
        tl.to(["#count", "#countlbl", "#dots"], { opacity: 0, duration: 0.6, ease: "power2.in" }, 9.2);

        // 9 → 13 : merci, lent
        tl.fromTo("#merci", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 9.8);
        tl.to("#merci", { opacity: 0, duration: 0.6, ease: "power2.in" }, 12.5);

        // 13 → 20 : deux lignes
        tl.fromTo("#l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 13.3);
        tl.fromTo("#l2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 15.2);
        tl.to(["#l1", "#l2"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 19.8);

        // 20.55 : le drop de la musique → flash, anneau, début
        tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 20.5);
        tl.fromTo("#debut", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 20.55);
        // anneau 50/30/20 : 1696 = circonférence ; chaque arc dessiné à la suite
        tl.to("#r1", { strokeDashoffset: 1696 - 1696 * 0.5, duration: 0.9, ease: "power2.out" }, 20.6);
        tl.set("#r2", { rotation: 180, transformOrigin: "50% 50%" }, 20.6);
        tl.to("#r2", { strokeDashoffset: 1696 - 1696 * 0.3, duration: 0.6, ease: "power2.out" }, 21.4);
        tl.set("#r3", { rotation: 288, transformOrigin: "50% 50%" }, 20.6);
        tl.to("#r3", { strokeDashoffset: 1696 - 1696 * 0.2, duration: 0.5, ease: "power2.out" }, 21.9);
        tl.fromTo("#ringwrap", { opacity: 0, scale: 0.9 }, { opacity: 0.22, scale: 1.35, duration: 2.0, ease: "sine.out" }, 20.6);
        // 22.6 : le « début » laisse la place à la 2.0
        tl.to("#debut", { opacity: 0, y: -40, duration: 0.45, ease: "power2.in" }, 22.5);
        tl.fromTo("#teaser", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 22.9);
        tl.fromTo("#foot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 23.4);
        tl.to("#fadeout", { opacity: 1, duration: 1.1, ease: "power2.in" }, 24.9);

        window.__timelines["merci500"] = tl;
      });
    </script>
  </body>
</html>
